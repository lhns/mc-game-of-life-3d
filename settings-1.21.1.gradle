// Alternate settings file for the Minecraft 1.21.1 modules only (Scala 3, Mojmap+Parchment,
// Fabric Loom 1.7 and ModDevGradle). Invoke via ./gradlew-1.21.1 which passes this file and
// points at the Gradle 8.10 wrapper under gradle-1.21.1/. The default settings.gradle lists
// the legacy 1.15.2-1.17 / forge 1.15.2-1.16.5 modules and is used by the default ./gradlew
// on Gradle 7.3.

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        // mcdp's Gradle plugin (`de.lhns.mcdp`) is published to Maven Central.
        mavenCentral()
        // Sonatype Central Portal snapshots — kept alongside mavenCentral so the
        // `mcdp_version` property in root gradle.properties can flip between release
        // (e.g. `0.1.2`) and snapshot (e.g. `0.1.3-SNAPSHOT`) without repo edits.
        maven {
            name = 'sonatype-central-snapshots'
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
        }
        gradlePluginPortal()
    }

    // Pin the de.lhns.mcdp plugin version centrally so the plugins{} block in
    // build-1.21.1.gradle can reference it with `id 'de.lhns.mcdp'` (no `version` arg —
    // Gradle's plugins{} doesn't allow ${...} interpolation in version strings, but
    // pluginManagement.plugins resolves the same property without that restriction).
    plugins {
        id 'de.lhns.mcdp' version "${mcdp_version}"
    }
}

rootProject.name = 'mc-game-of-life-3d'
// Use a separate root build file so fabric-loom + de.lhns.mcdp can be declared in a shared
// plugins {} block without colliding with the legacy build.gradle (Gradle 7.3 / ForgeGradle 5,
// which can't resolve those plugin coords).
rootProject.buildFileName = 'build-1.21.1.gradle'

include ':common-1.21.1'
include ':fabric-1.21.1'
include ':neoforge-1.21.1'
